name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Restore locked detector data cache
        uses: actions/cache@v6
        with:
          path: |
            data/unified_bank.json
            data/shared_detector.bin
          key: detector-assets-${{ hashFiles('data/detector.lock.json') }}
      - name: Restore Cargo build cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-checks-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: |
            cargo-checks-${{ runner.os }}-${{ runner.arch }}-
      - name: Verify locked reference data
        run: python scripts/detector_assets.py
      - name: Run tests and lints
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          CPR_REQUIRE_BANK: '1'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          python -m unittest discover -s tests -p 'test_*.py'
          node --check web/app.js
