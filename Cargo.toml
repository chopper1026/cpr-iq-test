[package]
name = "cpr-iq-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "6950c02ee460143dd63103a35a5dd679712488dc", features = ["io"] }
lmfpd = { git = "https://github.com/Ikaleio/lm-detector.git", rev = "6530eeea79bb3794bd7b0e9f1b1c180921c924b3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "macros", "rt", "time", "sync"] }

[profile.release]
strip = "symbols"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
