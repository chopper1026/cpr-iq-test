[package]
name = "cpr-iq-test"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
base64 = "0.22"
flate2 = "1"
gateway-plugin-sdk = { git = "https://github.com/zyycn/codex-proxy-rs.git", rev = "45a4d580c7e1ac2b2c0308d72ae5018148f2516a", features = ["io"] }
lmfpd = { git = "https://github.com/Ikaleio/lm-detector.git", rev = "e0472890bea827d15ca883636a77d4c10bbe843b" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "macros", "rt", "time", "sync"] }

[profile.release]
strip = "symbols"
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
